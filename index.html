    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SAQO" />

    <title>SAQO — Send Anything. Anywhere.</title>
    <meta name="description" content="Fast, reliable parcel delivery across cities and states in Nigeria. Request a rider, track your parcel, and deliver with confidence." />
    <meta property="og:title" content="SAQO — Send Anything. Anywhere." />
    <meta property="og:description" content="Fast, reliable parcel delivery across cities and states in Nigeria. Request a rider, track your parcel, and deliver with confidence." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      #saqo-startup {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #000;
      }

      #saqo-startup svg {
        display: block;
        width: min(76vw, 30rem);
        height: auto;
      }

      .saqo-startup-sheen {
        animation: saqo-logo-sweep 2.2s ease-in-out infinite;
      }

      .saqo-startup-trail {
        animation: saqo-trail-move 1.65s ease-in-out infinite;
      }

      @keyframes saqo-logo-sweep {
        0%, 12% { transform: translateX(-700px); }
        78%, 100% { transform: translateX(2000px); }
      }

      @keyframes saqo-trail-move {
        from { transform: translateX(-100px); }
        to { transform: translateX(360px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .saqo-startup-sheen,
        .saqo-startup-progress {
          display: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
